<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="atividade.css">
    <title>Cadastro</title>
</head>

<body>
    
    <h1>Hotel Funari's</h1>
    <hr>
    <hr>

    <div class="container">
        <h2>Cadastro de Clientes</h2>


        <form>
            <div class="form-control">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome">
            </div>
            <div class="form-control">
                <label for="email">Email:</label>
                <input type="email" id="email" />
            </div>

             <div class="form-control">
                <label for="telefone">Telefone:</label>
                <input type="password">
            </div>

             <div class="form-control">
                <label for="senha">Senha:</label>
                <input type="password">
            </div>

            <div class="form-control">
                <label for="data">Data de Hospedagem:</label>
                <input type="date" name="data">
            </div>

            <div class="form-control">
                <label for="regiao">Região de Preferência:</label>

                <select name="regiao" id="regiao">
                    <option value="">Selecione</option>
                    <option value="cotia">Cotia - SP</option>
                    <option value="butanta">Butantã</option>
                    <option value="carapicuiba">Carapicuíba</option>
                     <option value="Embu das Artes">Embu das Artes</option>
                </select>

                
                
            </div>

            <div class="form-control">
                <button type="submit">Cadastrar</button>
            </div>
        </form>

        <br>
        <hr><hr>


    </div>
</body>

</html>
